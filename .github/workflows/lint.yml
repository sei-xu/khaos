name: Lint and typecheck

# Runs the same gate CLAUDE.md asks contributors to run by hand (`npm run
# lint` with --max-warnings 0, plus `npm run typecheck`), so a regression
# can't land on main without someone noticing. On pull_request it checks the
# branch; on push to main it also covers anything that lands there without
# a PR run.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
